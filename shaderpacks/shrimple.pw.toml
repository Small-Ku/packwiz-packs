Shrimple

A shaderpack that keeps Minecraft's vanilla look intact while adding optional features like swaying plants, colored torchlight that reacts to handheld items, and glass-tinted lighting. Experimental ray-traced block-light shadows included; water reflections and global illumination remain basic.
保留 Minecraft 原版視覺風格的光影包，提供植物搖曳、手持光源、玻璃染色光效等可選功能。含實驗性方塊光源光追陰影，水體反射與全局光照效果維持基礎水平。

