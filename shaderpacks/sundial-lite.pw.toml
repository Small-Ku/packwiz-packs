Sundial Lite

A free open-source shaderpack implementing physically-based deferred rendering with configurable quality settings. Features realistic shadows, atmospheric effects, and PBR material support. Temporarily excludes path-traced effects and Nether/End dimensions found in the paid version.
免費開源光影包，採用物理基礎延遲渲染技術，提供可調節畫質設定。具備真實陰影、大氣效果與PBR材質支援。暫時不含付費版的光線追蹤效果與下界/終界維度特效。

See more at https://github.com/GeForceLegend/Sundial-Lite"""
