Discerning Furnace

A minimal mod preventing non-smeltable items from entering furnace input slots—blocks invalid items from players (client) and hoppers (server). Works with vanilla and compatible modded furnaces.
精簡模組，阻止不可熔煉物品進入熔爐輸入格。客戶端防止玩家放入無效物品，伺服器端阻擋漏斗輸入。適用於原版熔爐及相容的模組熔爐。"""
